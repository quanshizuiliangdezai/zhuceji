name: sync-upstream

# 方案 B：main 永远保持 fork 原样（不碰业务代码），
# upstream-sync 维护纯上游镜像，功能分支定期 rebase 到 upstream/main。
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (default branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/AaronL725/grok-register.git
          git fetch upstream
          git fetch origin

      - name: Update upstream-sync mirror (pure upstream, never touches main)
        run: |
          git checkout -B upstream-sync upstream/main
          git push origin upstream-sync --force

      - name: Rebase feature branch onto upstream/main
        id: rebase
        continue-on-error: true
        run: |
          FEAT=feat/sub2api-discover
          if ! git show-ref --verify --quiet "refs/remotes/origin/$FEAT"; then
            echo "feat branch $FEAT not found on origin, skip rebase"
            echo "rebased=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Guard: only rebase when upstream/main actually has NEW commits.
          # If upstream/main is already an ancestor of feat, there is nothing to
          # rebase. Previously this step errored on the runner (e.g. failed
          # fetch/push) and was misreported as a "conflict", spamming one issue
          # per hourly run even when upstream had not changed.
          if git merge-base --is-ancestor "upstream/main" "origin/$FEAT"; then
            echo "upstream/main already merged into $FEAT; nothing to rebase"
            echo "rebased=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout "$FEAT"
          if git rebase "upstream/main"; then
            git push origin "$FEAT" --force-with-lease
            echo "rebased=ok" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            echo "rebased=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on rebase conflict (deduplicated)
        if: steps.rebase.outputs.rebased == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ feat/sub2api-discover 无法自动 rebase 到 upstream（存在冲突）';
            // Dedup: never create a second open issue with the same title.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (existing.data.some(i => i.title === title)) {
              console.log('An open conflict issue already exists; skipping duplicate creation.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: '上游有更新且自动 rebase 出现冲突，已中止以免丢失代码。\n\n请手动处理：\n```\ngit fetch upstream\ngit checkout feat/sub2api-discover\ngit rebase upstream/main\n# 解决冲突后\ngit push origin feat/sub2api-discover --force-with-lease\n```'
            });
