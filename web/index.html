<style>

ing:0 16px;border-radius:8px;cursor:pointer;font-weight:650;transition:.15s ease}.action:hover:not(:disabled){border-color:#45454b;background:#1d1d21}.action.primary{background:var(--accent);color:#080b00;border-color:var(--accent);box-shadow:0 0 0 1px rgba(200,255,0,.08),0 0 18px rgba(200,255,0,.08)}.action.primary:hover:not(:disabled){background:#d4ff36;box-shadow:0 0 20px rgba(200,255,0,.20);transform:translateY(-1px)}.action.stop{background:#2a1414;color:#ffb8b8;border-color:#653030}.action:disabled{opacity:.42;cursor:not-allowed}.action svg{width:16px;height:16px}.page{max-width:1280px;margin:0 auto;padding:28px 24px 40px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.stat{height:110px;background:rgba(21,21,23,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}.stat:hover{border-color:#3a3a40;transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.16)}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:29px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.stat-value.good{color:var(--green)}.stat-value.bad{color:var(--red)}.status-line{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}.status-dot{width:9px;height:9px;border-radius:50%;background:#66676d}.status-dot.running{background:var(--accent);box-shadow:0 0 0 4px rgba(200,255,0,.10)}.status-dot.cancelled{background:var(--warn)}.substats{font-size:11px;color:#6f7077;display:flex;gap:12px}.notice{min-height:18px;margin:-10px 2px 14px;color:var(--muted);font-size:12px}.notice.error{color:#ff7f7f}.main-grid{display:grid;grid-template-columns:minmax(600px,1.1fr) minmax(430px,.9fr);gap:24px;align-items:start}.panel{background:rgba(21,21,23,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.10)}.tabs{height:49px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow-x:auto}.tab{position:relative;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#96969e;padding:0 20px;cursor:pointer;white-space:nowrap;font-weight:650}.tab svg{width:16px;height:16px;opacity:.8}.tab:hover{color:#d5d5da}.tab.active{color:var(--accent);background:rgba(200,255,0,.035)}.tab.active:after{content:"";height:2px;position:absolute;left:0;right:0;bottom:-1px;background:var(--accent)}.section{display:none;padding:22px 24px 26px;min-height:460px}.section.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}.field{min-width:0;display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field-label{font-size:13px;color:#dedee3;font-weight:600}.field-help{font-size:11px;color:#707079;min-height:15px}.field input,.field select{width:100%;height:38px;border:1px solid #2d2d32;border-radius:8px;background:#101012;color:var(--fg);padding:0 12px;outline:none;transition:.15s}.field input:focus,.field select:focus{border-color:#666a4e;box-shadow:0 0 0 2px rgba(200,255,0,.06)}.field input:disabled,.field select:disabled{opacity:.55}.check-row{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-height:28px;color:#e6e6e8;font-weight:600}.check-row input{appearance:none;width:16px;height:16px;border:1px solid #5a5a60;border-radius:2px;background:#fff;display:grid;place-items:center;cursor:pointer}.check-row input:checked{background:var(--accent);border-color:var(--accent)}.check-row input:checked:after{content:"✓";font-size:12px;line-height:1;color:#111;font-weight:900}.check-row input:disabled{opacity:.5;cursor:not-allowed}.check-help{grid-column:1/-1;margin-top:-12px;margin-left:26px;font-size:11px;color:#707079}.terminal-panel{min-height:510px;display:flex;flex-direction:column}.terminal-head{height:49px;display:flex;align-items:center;padding:0 16px 0 18px;border-bottom:1px solid var(--line);gap:9px}.terminal-head svg{width:16px;height:16px}.terminal-title{font-weight:700}.terminal-actions{margin-left:auto;display:flex;gap:8px}.mini-btn{display:inline-flex;align-items:center;gap:6px;background:#18181b;border:1px solid #303035;color:#c8c8cf;border-radius:7px;height:28px;padding:0 10px;cursor:pointer;font-size:11px}.mini-btn:hover{background:#202024}.mini-btn svg{width:13px;height:13px}.terminal-body{height:462px;overflow:auto;background:#020303;padding:18px 19px;font:12px/1.75 "SFMono-Regular",Consolas,"Liberation Mono",monospace;color:#d6d6d9;white-space:pre-wrap;word-break:break-word;scrollbar-width:thin;scrollbar-color:#343438 #09090a}.line{margin:0 0 3px}.line.ok{color:#6ee7a1}.line.bad{color:#ff7f7f}.line.info{color:var(--blue)}.line.warn{color:#ffd178}.empty-log{color:#5c5d62}.footer-note{display:flex;justify-content:space-between;margin-top:12px;padding:0 4px;color:#5f6067;font-size:11px}

@media(max-width:760px){.topbar{height:auto;min-height:62px;padding:10px 14px;flex-wrap:wrap}.brand{order:1}.spacer{display:none}.lang-switch{margin-left:auto;order:1}.action{order:2;height:36px;padding:0 12px}.page{padding:18px 12px 30px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{height:96px;padding:15px}.main-grid{gap:14px}.grid{grid-template-columns:1fr}.field.full,.check-row,.check-help{grid-column:1}.section{padding:18px 16px}.tab{padding:0 14px}}
@media(max-width:430px){.brand-name{font-size:16px}.repo-pill{padding:4px 7px}.repo-pill span{display:none}.stats{grid-template-columns:1fr 1fr}.stat-value{font-size:25px}.action .btn-text{display:none}.action{width:42px;justify-content:center;padding:0}.terminal-actions .mini-label{display:none}}
.sso-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sso-title{font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em}
.sso-sub{color:var(--muted);font-size:12px;margin-top:4px}
.sso-actions{display:flex;gap:10px;flex-wrap:wrap}
.sso-list{display:flex;flex-direction:column;gap:14px;max-height:560px;overflow-y:auto;padding-right:4px}
.sso-card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.sso-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.sso-email{font-weight:700;font-size:15px;word-break:break-all}
.sso-meta{color:var(--muted);font-size:12px;margin:4px 0 10px;word-break:break-all}
.sso-token{position:relative;background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--soft);max-height:120px;overflow-y:auto;user-select:all}
.sso-card-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.sso-card-actions button{height:34px;padding:0 14px;border-radius:8px;font-weight:650;font-size:13px}
.sso-card-actions button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.sso-card-actions button.ghost:hover{background:var(--panel)}
.sso-badge{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

.tunnel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tunnel-title{font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em}
.tunnel-sub{color:var(--muted);font-size:12px;margin-top:4px;max-width:560px}
.tunnel-state{font-size:13px;font-weight:650;padding:5px 12px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.tunnel-state.on{color:var(--green);border-color:var(--green)}
.tunnel-state.off{color:var(--muted)}
.tunnel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tunnel-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--soft)}
.tunnel-field span{font-weight:600}
.tunnel-field input,.tunnel-field select{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel3);color:var(--fg);padding:0 10px;font-size:13px;width:100%;box-sizing:border-box}
.tunnel-field input:focus,.tunnel-field select:focus{outline:none;border-color:var(--accent)}
.tunnel-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tunnel-actions button{height:34px;padding:0 16px;border-radius:8px;font-weight:650;font-size:13px;cursor:pointer}
.tunnel-actions button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.tunnel-actions button.ghost:hover{background:var(--panel)}
.tunnel-actions button:not(.ghost){background:var(--accent);color:#080b00;border:0}
.tunnel-actions button:not(.ghost):hover{background:var(--accent2)}
.tunnel-autostart{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;background:var(--panel3);border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.tunnel-as-label{font-size:13px;color:var(--soft)}
.tunnel-as-label b{color:var(--accent)}
.tunnel-autostart button{height:30px;padding:0 12px;border-radius:7px;font-weight:600;font-size:12px;background:transparent;color:var(--fg);border:1px solid var(--line);cursor:pointer}
.tunnel-autostart button:hover{background:var(--panel)}
.tunnel-result{margin-top:14px;font-size:13px;line-height:1.7;color:var(--soft)}
.tunnel-test-line{padding:4px 0}
.tunnel-test-line.ok{color:var(--green)}
.tunnel-test-line.bad{color:var(--red)}
.tunnel-plink{margin-top:14px;padding:12px 14px;background:var(--panel3);border:1px solid var(--line);border-radius:8px}
.tunnel-plink-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tunnel-plink-head b{color:var(--accent)}
.tunnel-plink-head button{height:30px;padding:0 14px;border-radius:7px;font-weight:600;font-size:12px;background:transparent;color:var(--fg);border:1px solid var(--line);cursor:pointer}
.tunnel-plink-head button:hover{background:var(--panel)}
.tunnel-plink-tip{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.6}
.tunnel-plink-tip code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:11px}
@media(max-width:760px){.tunnel-grid{grid-template-columns:1fr 1fr}}
.sso-badge.ok{color:var(--green);border-color:var(--green)}
.sso-badge.warn{color:var(--warn);border-color:var(--warn)}
.sso-badge.expired{color:var(--red);border-color:var(--red)}
.sso-empty{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
.sso-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.sso-toast.show{opacity:1}
.sso-config{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.sso-config-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sso-config-title{font-size:15px;font-weight:700}
.sso-config-state{font-size:12px;color:var(--muted)}
.sso-config-state.bad{color:var(--red)}
.sso-config-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sso-field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.sso-field input,.sso-field select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel3);color:var(--fg);padding:0 10px;font-size:13px}
.sso-field input:focus,.sso-field select:focus{outline:none;border-color:var(--accent)}
.sso-field select option{background:var(--panel3);color:var(--fg)}
.sso-config-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.sso-check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--soft);cursor:pointer}
.sso-config-actions{display:flex;gap:8px}
.sso-config-actions button{height:34px;padding:0 16px;border-radius:8px;font-weight:650;font-size:13px;cursor:pointer}
.sso-config-actions button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.sso-config-actions button.ghost:hover{background:var(--panel)}
.sso-config-actions button:not(.ghost){background:var(--accent);color:#080b00;border:0}
.sso-config-actions button:not(.ghost):hover{background:var(--accent2)}
.sso-discover-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;white-space:pre-wrap;min-height:0}
.sso-pool-status{font-size:12px;color:var(--soft);margin-top:12px;padding:10px 12px;background:var(--panel3);border:1px solid var(--line);border-radius:8px;line-height:1.6;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sso-pool-status .num{font-weight:700;color:var(--accent)}
.sso-pool-status .bad{color:var(--red)}
.sso-pool-status .ok{color:var(--green)}
@media(max-width:760px){.sso-config-grid{grid-template-columns:1fr 1fr}}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}.modal.show{opacity:1;pointer-events:auto}.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}.modal-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:min(420px,92vw);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-head h3{margin:0;font-size:16px}.modal-head .ghost{width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--fg);font-size:18px;cursor:pointer}.modal-head .ghost:hover{background:var(--panel)}.modal-body{display:flex;flex-direction:column;gap:12px}.modal-body .sso-field input{width:100%}.modal-hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.modal-actions button{height:36px;padding:0 16px;border-radius:8px;font-weight:650;cursor:pointer;border:0}.modal-actions button.primary{background:var(--accent);color:#080b00}
.autostart-box{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.autostart-head{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--fg)}
.autostart-status{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.autostart-status.on{color:var(--green)}
.autostart-status.off{color:var(--muted)}
</style>
</head>

<main class="page">

    <div class="stat"><div class="stat-label" data-i18n="target">目标数量</div><div id="sTarget" class="stat-value">0</div><div></div></div>

    <div class="panel">
      <div id="tabs" class="tabs"></div>
      <div id="sections"></div>
    </div>
    <div class="panel terminal-panel">
      <div class="terminal-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 7 4 5-4 5M11 17h8"/></svg>
        <span class="terminal-title" data-i18n="liveLog">实时控制台日志</span>
        <div class="terminal-actions">
          <button id="copyBtn" class="mini-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span class="mini-label" data-i18n="copyLog">复制日志</span></button>

<div id="serverSettingsModal" class="modal" hidden>
  <div class="modal-backdrop" onclick="closeServerSettings()"></div>
  <div class="modal-card">
    <div class="modal-head"><h3 data-i18n="panelSettings">面板设置</h3><button id="closeServerModal" class="ghost" type="button">×</button></div>
    <div class="modal-body">
      <label class="sso-field"><span>监听 IP</span><input id="panelHost" value="127.0.0.1" placeholder="127.0.0.1"></label>

      <p class="modal-hint">修改后保存并重启，服务会切换到新地址。重启完成后页面会自动跳转。</p>

        <div class="autostart-head">开机自启</div>
        <div class="autostart-status" id="autostartStatus">检测中…</div>

    <div class="modal-actions">

  </div>

let _sub2apiOptions = { groups: [], proxies: [], models: [] };

function _buildSelectOptions(items, type) {
  if (type === 'group') {
    return (items || []).map(g => ({ value: g.id, text: '#' + g.id + ' ' + (g.name || '') + ' (' + (g.platform || '') + ')' }));
  }
  if (type === 'proxy') {
    return (items || []).map(p => ({
      value: (p.protocol || 'http') + '|' + (p.host || '') + '|' + (p.port || '') + '|' + (p.username || '') + '|' + (p.password || ''),
      text: '#' + (p.id || '?') + ' ' + (p.name || '') + ' [' + (p.status || '') + ']'
    }));
  }
  if (type === 'model') {
    return (items || []).map(m => ({ value: m, text: m }));
  }
  return [];
}

function _setSelect(id, options, selectedValue, placeholder) {
  const sel = $(id); if (!sel) return;
  sel.innerHTML = '';
  if (placeholder) {
    const opt = document.createElement('option');
    opt.value = ''; opt.textContent = placeholder; opt.disabled = true;
    sel.appendChild(opt);
  }
  let hasSelected = false;
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value; opt.textContent = o.text;
    if (String(o.value) === String(selectedValue)) { opt.selected = true; hasSelected = true; }
    sel.appendChild(opt);
  });
  if (!hasSelected && selectedValue != null && selectedValue !== '') {
    const opt = document.createElement('option');
    opt.value = selectedValue; opt.textContent = selectedValue + (lang === 'zh' ? ' (已保存)' : ' (saved)'); opt.selected = true;
    sel.insertBefore(opt, sel.firstChild);
  }
}

function _proxyKeyFromProxy(p) {
  return (p.protocol || 'http') + '|' + (p.host || '') + '|' + (p.port || '') + '|' + (p.username || '') + '|' + (p.password || '');
}

function _syncProxyIdFromSelect(savedId) {
  const sel = $('sub2apiProxyKey');
  const hidden = $('sub2apiProxyId');
  if (!sel || !hidden) return;
  const key = sel.value;
  const p = (_sub2apiOptions.proxies || []).find(x => _proxyKeyFromProxy(x) === key);
  hidden.value = p && p.id != null ? p.id : (savedId || '');
}

function populateSub2apiSelects(groups, proxies, models, selected) {
  _sub2apiOptions = { groups: groups || [], proxies: proxies || [], models: models || [] };
  const s = selected || {};
  _setSelect('sub2apiGroupId', _buildSelectOptions(groups, 'group'), s.group_id, lang === 'zh' ? '请选择账号池' : 'Select group');
  _setSelect('sub2apiProxyKey', _buildSelectOptions(proxies, 'proxy'), s.proxy_key, lang === 'zh' ? '请选择代理' : 'Select proxy');
  _setSelect('sub2apiGrokModel', _buildSelectOptions(models, 'model'), s.model, lang === 'zh' ? '请选择模型' : 'Select model');
  _syncProxyIdFromSelect(s.proxy_id);
}

async function autoDiscoverSub2api(savedGroup, savedProxyId, savedProxy, savedModel) {
  const base = $('sub2apiBaseUrl').value.trim();
  const email = $('sub2apiEmail').value.trim();
  if (!base || !email) return;
  try {
    const res = await fetch('/api/sso/discover-sub2api', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base_url: base, email: email, password: '' })
    });
    const d = await res.json();
    if (d.ok) {
      const s = d.suggested || {};
      populateSub2apiSelects(d.groups, d.proxies, d.models, {
        group_id: savedGroup != null ? savedGroup : s.group_id,
        proxy_id: savedProxyId != null ? savedProxyId : s.proxy_id,
        proxy_key: savedProxy || s.proxy_key,
        model: savedModel || s.model
      });
      const groups = (d.groups || []).map(g => '#' + g.id + ' ' + g.name + ' (' + g.platform + ')').join(' / ');
      const proxies = (d.proxies || []).map(p => '#' + p.id + ' ' + p.name + ' [' + p.status + ']').join(' / ');
      const models = (d.models || []).join(', ') || (lang === 'zh' ? '无' : 'none');
      const hint = $('ssoDiscoverHint');
      if (hint) hint.textContent = (lang === 'zh' ? '可用配置：' : 'Available:')
        + '\n' + (lang === 'zh' ? '账号池' : 'Groups') + ': ' + groups
        + '\n' + (lang === 'zh' ? '代理' : 'Proxies') + ': ' + proxies
        + '\n' + (lang === 'zh' ? '模型' : 'Models') + ': ' + models;
    }
  } catch (e) { /* 静默失败，保留默认值 */ }
}

function syncSub2api() {
  const st = $('ssoSyncState');
  st.textContent = lang === 'zh' ? '同步中…' : 'Syncing…';
  st.className = 'sso-config-state';
  fetch('/api/sso/sync-sub2api', { method: 'POST' }).then(r => r.json()).then(d => {
    if (d.ok) {
      st.textContent = (lang === 'zh'
        ? '已添加 ' + d.added + ' · 已关联 ' + d.linked + ' · 已清理 ' + d.deleted
        : 'added ' + d.added + ' · linked ' + d.linked + ' · cleaned ' + d.deleted);
      ssoToast(lang === 'zh' ? '同步完成' : 'Sync done');
    } else {
      st.textContent = (lang === 'zh' ? '失败: ' : 'failed: ') + (d.reason || '');
      st.className = 'sso-config-state bad';
      ssoToast(lang === 'zh' ? '同步失败' : 'Sync failed');
    }
    loadSso();
  }).catch(e => { st.textContent = (lang === 'zh' ? '错误: ' : 'error: ') + e.message; st.className = 'sso-config-state bad'; });
}

function discoverSub2api(silent) {
  const base = $('sub2apiBaseUrl').value.trim();
  const email = $('sub2apiEmail').value.trim();
  const pw = $('sub2apiPassword').value;
  const st = $('ssoSyncState');
  const hint = $('ssoDiscoverHint');
  if (!base || !email) {
    if (silent) return;
    const msg = lang === 'zh' ? '请先填写 sub2api 地址和邮箱' : 'Please fill base URL and email';
    st.textContent = msg; st.className = 'sso-config-state bad';
    ssoToast(msg);
    return;
  }
  if (!silent) {
    st.textContent = lang === 'zh' ? '获取中…' : 'Discovering…';
    st.className = 'sso-config-state';
  }
  if (hint) hint.textContent = '';
  if (!pw && hint && !silent) {
    hint.textContent = lang === 'zh' ? '密码框为空，将尝试使用本地已保存密码…' : 'Password empty, will use saved password…';
  }
  fetch('/api/sso/discover-sub2api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ base_url: base, email: email, password: pw }),
  }).then(r => r.json()).then(d => {
    if (d.ok) {
      const s = d.suggested || {};
      const currentGroup = $('sub2apiGroupId').value;
      const currentProxyId = $('sub2apiProxyId').value;
      const currentProxy = $('sub2apiProxyKey').value;
      const currentModel = $('sub2apiGrokModel').value;
      populateSub2apiSelects(d.groups, d.proxies, d.models, {
        group_id: currentGroup || s.group_id,
        proxy_id: currentProxyId || s.proxy_id,
        proxy_key: currentProxy || s.proxy_key,
        model: currentModel || s.model
      });
      const groups = (d.groups || []).map(g => '#' + g.id + ' ' + g.name + ' (' + g.platform + ')').join(' / ');
      const proxies = (d.proxies || []).map(p => '#' + p.id + ' ' + p.name + ' [' + p.status + ']').join(' / ');
      const models = (d.models || []).join(', ') || (lang === 'zh' ? '无' : 'none');
      if (hint) hint.textContent = (lang === 'zh' ? '已自动回填。可用配置：' : 'Auto-filled. Available:')
        + '\n' + (lang === 'zh' ? '账号池' : 'Groups') + ': ' + groups
        + '\n' + (lang === 'zh' ? '代理' : 'Proxies') + ': ' + proxies
        + '\n' + (lang === 'zh' ? '模型' : 'Models') + ': ' + models;
      if (!silent) {
        st.textContent = lang === 'zh' ? '获取成功' : 'Discovered';
        ssoToast(lang === 'zh' ? '配置已获取' : 'Config discovered');
      }
    } else {
      if (!silent) {
        st.textContent = (lang === 'zh' ? '失败: ' : 'failed: ') + (d.reason || '');
        st.className = 'sso-config-state bad';
        ssoToast(lang === 'zh' ? '获取失败' : 'Discover failed');
      }
    }
  }).catch(e => {
    if (!silent) {
      st.textContent = (lang === 'zh' ? '错误: ' : 'error: ') + e.message;
      st.className = 'sso-config-state bad';
    }
  });
}

async function loadPoolStatus() {
  const box = $('ssoPoolStatus'); if (!box) return;
  try {
    const r = await fetch('/api/sso/pool-status');
    const d = await r.json();
    if (!d.ok) {
      box.innerHTML = '<span>' + (lang === 'zh' ? '池状态：' : 'Pool: ') + (d.reason || 'unknown') + '</span>';
      return;
    }
    const target = d.target || 0;
    const avail = d.available ?? 0;
    const gap = d.gap || 0;
    const total = d.total || 0;
    const expired = d.expired || 0;
    const smartOn = target > 0;
    const okClass = gap <= 0 ? 'ok' : 'bad';
    const left = (lang === 'zh'
      ? '目标 <span class="num">' + target + '</span> · 可用 <span class="num ' + okClass + '">' + avail + '</span> · 缺口 <span class="num ' + okClass + '">' + gap + '</span> · 总计 ' + total + ' · 待清理 ' + expired
      : 'Target <span class="num">' + target + '</span> · Available <span class="num ' + okClass + '">' + avail + '</span> · Gap <span class="num ' + okClass + '">' + gap + '</span> · Total ' + total + ' · To clean ' + expired);
    const right = smartOn
      ? (lang === 'zh' ? '智能补充已启用' : 'Smart fill ON')
      : (lang === 'zh' ? '智能补充已关闭' : 'Smart fill OFF');
    box.innerHTML = '<span>' + left + '</span><span>' + right + '</span>';
  } catch (e) {
    const box = $('ssoPoolStatus'); if (!box) return;
    box.innerHTML = '<span>' + (lang === 'zh' ? '池状态加载失败' : 'Pool status failed') + '</span>';
  }
}

function fillPool() {
  const st = $('ssoSyncState');
  st.textContent = lang === 'zh' ? '补充中…' : 'Filling…';
  st.className = 'sso-config-state';
  fetch('/api/sso/pool-fill', { method: 'POST' }).then(r => r.json()).then(d => {
    if (d.ok) {
      st.textContent = (lang === 'zh'
        ? '已启动补充: 缺口 ' + (d.gap ?? '?') + '，本次 ' + d.filled
        : 'Fill started: gap ' + (d.gap ?? '?') + ', batch ' + d.filled);
      ssoToast(lang === 'zh' ? '智能补充已启动' : 'Smart fill started');
    } else {
      st.textContent = (lang === 'zh' ? '补充失败: ' : 'Fill failed: ') + (d.reason || '');
      st.className = 'sso-config-state bad';
      ssoToast(lang === 'zh' ? '补充未启动' : 'Fill not started');
    }
    loadPoolStatus();
  }).catch(e => {
    st.textContent = (lang === 'zh' ? '错误: ' : 'error: ') + e.message;
    st.className = 'sso-config-state bad';
  });
}

function bindSub2api() {
  const discover = $('sub2apiDiscoverBtn'); if (discover) discover.onclick = discoverSub2api;
  const save = $('sub2apiSaveBtn'); if (save) save.onclick = saveSub2apiConfig;
  const sync = $('sub2apiSyncBtn'); if (sync) sync.onclick = syncSub2api;
  const fill = $('sub2apiFillBtn'); if (fill) fill.onclick = fillPool;
  const proxySel = $('sub2apiProxyKey');
  if (proxySel) proxySel.onchange = () => _syncProxyIdFromSelect();
}

function bindTunnel() {
  const bind = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  bind('tunnelSaveBtn', saveTunnelConfig);
  bind('tunnelBuildBtn', buildTunnel);
  bind('tunnelStopBtn', stopTunnel);
  bind('tunnelTestBtn', testTunnel);
  bind('tunnelAsSetBtn', () => setTunnelAutostart(true));
  bind('tunnelAsCancelBtn', () => setTunnelAutostart(false));
  const auth = $('tunnelAuth'); if (auth) auth.onchange = toggleTunnelPlinkBox;
  bind('tunnelPlinkInstallBtn', installPlink);
}

function _tunnelCfgFromForm() {
  const num = (id, def) => { const v = Number($(id).value); return Number.isFinite(v) ? v : def; };
  return {
    server: $('tunnelServer').value.trim(),
    ssh_port: num('tunnelSshPort', 22),
    user: $('tunnelUser').value.trim() || 'root',
    auth: $('tunnelAuth').value,
    key_path: $('tunnelKeyPath').value.trim(),
    key_pass: $('tunnelKeyPass').value,
    password: $('tunnelPassword').value,
    plink_path: $('tunnelPlinkPath').value.trim(),
    local_port: num('tunnelLocalPort', 18080),
    remote_port: num('tunnelRemotePort', 18080),
  };
}

async function loadTunnelConfig() {
  try {
    const r = await fetch('/api/tunnel/config');
    const d = await r.json();
    if (!d.ok) return;
    const c = d.config || {};
    $('tunnelServer').value = c.server || '';
    $('tunnelSshPort').value = c.ssh_port || 22;
    $('tunnelUser').value = c.user || 'root';
    $('tunnelAuth').value = c.auth === 'password' ? 'password' : 'key';
    $('tunnelKeyPath').value = c.key_path || '';
    $('tunnelKeyPass').value = d.key_pass_set ? c.key_pass || '' : '';
    $('tunnelPassword').value = d.password_set ? c.password || '' : '';
    $('tunnelLocalPort').value = c.local_port || 18080;
    $('tunnelRemotePort').value = c.remote_port || 18080;
    $('tunnelPlinkPath').value = c.plink_path || '';
    renderTunnelStatus(d.status, d.autostart);
    toggleTunnelPlinkBox();
  } catch (e) {
    setNotice(tt('loadFailed') + ': ' + e.message, true);
  }
}

function renderTunnelStatus(status, autostart) {
  const state = $('tunnelState');
  const asState = $('tunnelAsState');
  if (state && status) {
    const running = !!status.running;
    state.textContent = (running ? tt('running') : tt('stopped')) + ' · '
      + (status.enabled ? tt('enabled') : tt('notBuilt'));
    state.className = 'tunnel-state ' + (running ? 'on' : 'off');
  }
  if (asState && autostart) {
    asState.textContent = autostart.installed ? tt('autostartOn') : tt('autostartOff');
  }
}

async function saveTunnelConfig() {
  const cfg = _tunnelCfgFromForm();
  try {
    const r = await fetch('/api/tunnel/config', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg)
    });
    const d = await r.json();
    if (!r.ok) { setNotice('保存失败: ' + (d.detail || ''), true); return; }
    setNotice(tt('save') + ' ✓', false);
  } catch (e) { setNotice('保存失败: ' + e.message, true); }
}

function _tunnelLog(line) {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  appendLine({ line: '[' + t + '] ' + line });
}

async function buildTunnel() {
  const cfg = _tunnelCfgFromForm();
  await saveTunnelConfig();
  _tunnelLog('[*] 隧道：正在请求建立 ' + cfg.user + '@' + cfg.server + ':' + cfg.ssh_port);
  try {
    const r = await fetch('/api/tunnel/start', { method: 'POST' });
    const d = await r.json();
    if (!d.ok) {
      const msg = '建立失败: ' + (d.message || d.detail || '');
      setNotice(msg, true);
      _tunnelLog('[!] 隧道：' + msg);
      if (d.diag) {
        _tunnelLog('[!] 隧道诊断日志：' + d.diag.replace(/\n/g, ' | '));
      }
      return;
    }
    setNotice(tt('buildOk') + ' ✓', false);
    _tunnelLog('[+] 隧道：' + (d.message || '已发送建立请求'));
    loadTunnelConfig();
  } catch (e) {
    setNotice('建立失败: ' + e.message, true);
    _tunnelLog('[!] 隧道：建立失败 - ' + e.message);
  }
}

async function stopTunnel() {
  _tunnelLog('[*] 隧道：正在请求停止');
  try {
    const r = await fetch('/api/tunnel/stop', { method: 'POST' });
    const d = await r.json();
    setNotice('已停止隧道', false);
    _tunnelLog('[+] 隧道：' + (d.message || '已停止'));
    loadTunnelConfig();
  } catch (e) {
    setNotice('停止失败: ' + e.message, true);
    _tunnelLog('[!] 隧道：停止失败 - ' + e.message);
  }
}

async function testTunnel() {
  await saveTunnelConfig();
  const res = $('tunnelResult');
  res.className = 'tunnel-result';
  res.innerHTML = '<div class="tunnel-test-line">⏳ 测试中...</div>';
  _tunnelLog('[*] 隧道：正在测试连通性...');
  try {
    const r = await fetch('/api/tunnel/test', { method: 'POST' });
    const d = await r.json();
    let html = '';
    if (d.steps && d.steps.length) {
      html += d.steps.map(s => {
        _tunnelLog((s.ok ? '[+] ' : '[!] ') + s.name + '：' + (s.message || ''));
        return '<div class="tunnel-test-line ' + (s.ok ? 'ok' : 'bad') + '">'
          + (s.ok ? '✓' : '✗') + ' ' + s.name + '：' + (s.message || '') + '</div>';
      }).join('');
    }
    html += '<div class="tunnel-test-line ' + (d.ok ? 'ok' : 'bad') + '">'
      + (d.ok ? '✓ ' : '✗ ') + (d.message || '') + '</div>';
    res.innerHTML = html;
    res.classList.add(d.ok ? 'ok' : 'bad');
    _tunnelLog((d.ok ? '[+] ' : '[!] ') + '隧道测试：' + (d.message || ''));
  } catch (e) {
    res.innerHTML = '<div class="tunnel-test-line bad">✗ ' + e.message + '</div>';
    res.classList.add('bad');
    _tunnelLog('[!] 隧道测试异常 - ' + e.message);
  }
}

async function setTunnelAutostart(on) {
  const url = on ? '/api/tunnel/autostart/install' : '/api/tunnel/autostart/remove';
  _tunnelLog((on ? '[*] 正在设置隧道开机自启…' : '[*] 正在取消隧道开机自启…'));
  try {
    const r = await fetch(url, { method: 'POST' });
    const d = await r.json();
    if (!d.ok) {
      const msg = (on ? '设置' : '取消') + '开机自启失败: ' + (d.message || d.detail || '');
      _tunnelLog('[!] ' + msg);
      setNotice(msg, true);
      return;
    }
    _tunnelLog('[*] ' + (d.message || (on ? '已设置开机自启' : '已取消开机自启')));
    setNotice(d.message || (on ? tt('autostartOn') : tt('autostartOff')), false);
    loadTunnelConfig();
  } catch (e) {
    _tunnelLog('[!] 操作失败: ' + e.message);
    setNotice('操作失败: ' + e.message, true);
  }
}

function toggleTunnelPlinkBox() {
  const box = $('tunnelPlinkBox');
  if (!box) return;
  const isPwd = $('tunnelAuth').value === 'password';
  box.style.display = isPwd ? 'block' : 'none';
  if (isPwd) loadTunnelPlinkStatus();
}

async function loadTunnelPlinkStatus() {
  try {
    const r = await fetch('/api/tunnel/plink');
    const d = await r.json();
    const el = $('tunnelPlinkState');
    if (!el || !d.info) return;
    if (d.info.available) {
      el.textContent = '已就绪 · ' + (d.info.version || '').slice(0, 28);
      el.style.color = 'var(--green)';
    } else {
      el.textContent = '未检测到，请点「安装 plink」';
      el.style.color = 'var(--red)';
    }
  } catch (e) { /* 忽略：plink 状态不影响主流程 */ }
}

async function installPlink() {
  const st = $('tunnelPlinkState');
  if (st) st.textContent = '下载中…';
  try {
    await saveTunnelConfig();  // 先把 plink_path 等写入 tunnel.json
    const r = await fetch('/api/tunnel/plink?action=download', { method: 'GET' });
    const d = await r.json();
    if (!d.ok) { setNotice('安装 plink 失败: ' + (d.detail || ''), true); return; }
    setNotice('plink 已安装到 ' + (d.path || ''), false);
  } catch (e) { setNotice('安装 plink 失败: ' + e.message, true); }
  loadTunnelPlinkStatus();
}

function displayPanelHost(host) {
  if (!host || host === '0.0.0.0' || host === '::' || host === '::0') return window.location.hostname || '127.0.0.1';
  return host;
}

function updatePanelAddress(host, port) {
  const el = $('panelAddress');
  if (!el) return;
  el.textContent = ' · ' + displayPanelHost(host) + ':' + (port || 8092);
}

async function loadServerConfig() {
  try {
    const r = await fetch('/api/server/config');
    const d = await r.json();
    if (d.ok && d.config) {
      const c = d.config;
      $('panelHost').value = c.host || '127.0.0.1';
      $('panelPort').value = c.port || 8092;
      $('panelWorkers').value = c.workers || 1;
      updatePanelAddress(c.host, c.port);
    }
  } catch (e) {}
}

function openServerSettings() {
  loadServerConfig();
  $('serverSettingsModal').classList.add('show');
  $('serverSettingsModal').removeAttribute('hidden');
}

function closeServerSettings() {
  $('serverSettingsModal').classList.remove('show');
  setTimeout(() => $('serverSettingsModal').setAttribute('hidden', ''), 200);
}

async function saveAndRestartServer() {
  const host = ($('panelHost').value || '127.0.0.1').trim();
  const port = Math.max(1, Math.min(65535, Number($('panelPort').value) || 8092));
  const workers = Math.max(1, Number($('panelWorkers').value) || 1);
  if (!host) { setNotice('监听 IP 不能为空', true); return; }
  try {
    const r = await fetch('/api/server/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, port, workers })
    });
    const d = await r.json();
    if (!r.ok) { setNotice('保存失败: ' + (d.detail || ''), true); return; }
    updatePanelAddress(host, port);
    const rr = await fetch('/api/server/restart', { method: 'POST' });
    const rd = await rr.json();
    if (!rr.ok) { setNotice('重启失败: ' + (rd.detail || ''), true); return; }
    setNotice(rd.message || t('panelRestarting'));
    setTimeout(() => {
      window.location.href = 'http://' + displayPanelHost(host) + ':' + port;
    }, 5000);
  } catch (e) {
    setNotice('重启异常: ' + e.message, true);
  }
}

async function loadAutostartStatus() {
  const el = $('autostartStatus');
  if (!el) return;
  try {
    const r = await fetch('/api/server/autostart');
    const d = await r.json();
    if (d.ok) {
      if (d.installed) {
        el.className = 'autostart-status on';
        el.textContent = '已启用：登录 Windows 将自动后台启动（' + d.info.host + ':' + d.info.port + '）';
        if ($('autostartBtn')) $('autostartBtn').textContent = '刷新开机自启';
      } else {
        el.className = 'autostart-status off';
        el.textContent = '未启用：当前不会随登录自动启动。';
        if ($('autostartBtn')) $('autostartBtn').textContent = '设置开机自启';
      }
    }
  } catch (e) {
    el.className = 'autostart-status off';
    el.textContent = '检测失败：' + e.message;
  }
}

async function setupAutostart() {
  try {
    setNotice('正在设置开机自启…');
    const r = await fetch('/api/server/autostart/install', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) { setNotice('设置失败: ' + (d.detail || ''), true); return; }
    setNotice(d.message || '已设置开机自启');
    loadAutostartStatus();
  } catch (e) {
    setNotice('设置异常: ' + e.message, true);
  }
}

async function removeAutostart() {
  try {
    const r = await fetch('/api/server/autostart/remove', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) { setNotice('取消失败: ' + (d.detail || ''), true); return; }
    setNotice(d.message || '已取消开机自启');
    loadAutostartStatus();
  } catch (e) {
    setNotice('取消异常: ' + e.message, true);
  }
}

function bind() {
  renderFields(); applyLanguage();
  $('langZh').onclick = () => setLanguage('zh'); $('langEn').onclick = () => setLanguage('en');
  $('saveBtn').onclick = () => saveConfig().catch(e => setNotice(e.message, true));
  $('startBtn').onclick = () => startJob().catch(e => setNotice(e.message, true));
  $('stopBtn').onclick = () => stopJob().catch(e => setNotice(e.message, true));
  $('copyBtn').onclick = () => copyLogs(); $('clearBtn').onclick = () => clearLogs();
  const serverSettingsBtn = $('serverSettingsBtn');
  if (serverSettingsBtn) serverSettingsBtn.onclick = openServerSettings;
  const closeServerModal = $('closeServerModal');
  if (closeServerModal) closeServerModal.onclick = closeServerSettings;
  const saveServerConfigBtn = $('saveServerConfigBtn');
  if (saveServerConfigBtn) saveServerConfigBtn.onclick = saveAndRestartServer;
  const autostartBtn = $('autostartBtn');
  if (autostartBtn) autostartBtn.onclick = setupAutostart;
  const autostartRemoveBtn = $('autostartRemoveBtn');
  if (autostartRemoveBtn) autostartRemoveBtn.onclick = removeAutostart;
  loadConfig().catch(e => setNotice(e.message, true));
  loadServerConfig();
  loadAutostartStatus();
  bindSso(); loadSso();
  pollStatus(); pollLogs(); loadPoolStatus();
  setInterval(pollStatus, 1000); setInterval(pollLogs, 1000); setInterval(loadPoolStatus, 10000);
}
bind();
</script>
</body>
</html>
